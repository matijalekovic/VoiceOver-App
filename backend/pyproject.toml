[project]
name = "voice-studio-backend"
version = "0.1.0"
description = "Local API and inference worker for 1PAX Voice Studio"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.20",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "imageio-ffmpeg>=0.6.0",
    "psutil>=6.0",
    # qwen-tts pins transformers 4.57, which needs huggingface_hub below 1.0; the calls the
    # app makes (snapshot_download, model_info) work on both.
    "huggingface_hub>=1.0; sys_platform != 'win32'",
    "huggingface_hub>=0.34,<1.0; sys_platform == 'win32'",
    # Apple Silicon runs the MLX engines on the Apple GPU.
    "mlx-audio==0.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Windows runs the PyTorch engines: CUDA when an NVIDIA GPU is present, else the CPU.
    "qwen-tts==0.1.1; sys_platform == 'win32'",
    "torch>=2.7; sys_platform == 'win32'",
    "faster-whisper>=1.2; sys_platform == 'win32'",
]

[project.scripts]
voice-studio-server = "voice_studio.__main__:main"
voice-studio-validate = "voice_studio.validate:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_studio"]

[tool.uv]
# Resolve for the Macs and Windows PCs this ships on, and for Linux (CI and development).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is declared in argument defaults.
"src/voice_studio/api/*.py" = ["B008"]

# PyTorch's CUDA build for Windows; it also runs on PCs without an NVIDIA GPU.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
