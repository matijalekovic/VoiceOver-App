    { name = "huggingface-hub", specifier = ">=1.0" },
    { name = "imageio-ffmpeg", specifier = ">=0.6.0" },
    { name = "mlx-audio", marker = "platform_machine == 'arm64' and sys_platform == 'darwin'", specifier = "==0.6.1" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "psutil", specifier = ">=6.0" },
    { name = "pydantic", specifier = ">=2.9,<3" },
    { name = "python-multipart", specifier = ">=0.0.20" },
    { name = "soundfile", specifier = ">=0.12.1" },
    { name = "uvicorn", specifier = ">=0.32,<1" },
]

[package.metadata.requires-dev]
dev = [
    { name = "httpx", specifier = ">=0.27" },
    { name = "pytest", specifier = ">=8.3" },
    { name = "ruff", specifier = ">=0.8" },
]
